name: Build the RH manuscript
on:
  push:
    branches: [main]
    paths:
      - 'translation/manuscript.tex'
      - 'translation/chapters/**'
      - '.github/workflows/rh-manuscript.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-manuscript-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out only the entry point and chapters
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /translation/manuscript.tex
            /translation/chapters/
      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-luatex poppler-utils
      - name: Expand the standalone source
        working-directory: translation
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          root = Path.cwd()
          destination = Path(os.environ["RUNNER_TEMP"]) / "rh-manuscript"
          destination.mkdir()
          include = re.compile(r"(?m)^[ \t]*\\input\{(chapters/[^{}\n]+)\}[ \t]*(?:%[^\n]*)?$")
          def expand(path, active):
              if path in active:
                  raise ValueError(f"Cyclic input: {path}")
              def substitute(match):
                  name = match.group(1)
                  child = (root / (name if name.endswith(".tex") else name + ".tex")).resolve()
                  if not child.is_relative_to(root / "chapters"):
                      raise ValueError(f"Chapter outside translation/chapters: {name}")
                  return expand(child, (*active, path)).rstrip("\n")
              return include.sub(substitute, path.read_text(encoding="utf-8"))
          source = expand(root / "manuscript.tex", ())
          (destination / "rh-translation.tex").write_text(source, encoding="utf-8")
      - name: Compile both editions and check the references and page text
        working-directory: translation
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/rh-manuscript"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          compile() {
            latexmk -norc -lualatex -latexoption=-no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error "$1"
            log="${1%.tex}.log"
            if grep -Ein 'undefined references|undefined citations|Reference .* undefined|Citation .* undefined|multiply.defin(ed|ition)|Missing character:' "$log"; then
              echo "Reference or glyph validation failed in $log" >&2
              return 1
            fi
          }
          compile manuscript.tex
          pdftotext -layout manuscript.pdf "$RUNNER_TEMP/edition.txt"
          cd "$source_dir"
          compile rh-translation.tex
          pdftotext -layout rh-translation.pdf "$RUNNER_TEMP/standalone.txt"
          cmp "$RUNNER_TEMP/edition.txt" "$RUNNER_TEMP/standalone.txt"
          pdfinfo rh-translation.pdf | grep '^Pages:' >> "$GITHUB_STEP_SUMMARY"
      - name: Save the compiled paper and expanded source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-manuscript
          path: |
            ${{ runner.temp }}/rh-manuscript/rh-translation.pdf
            ${{ runner.temp }}/rh-manuscript/rh-translation.tex
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Retrieve the checked files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rh-manuscript
          path: paper
      - name: Publish a permanent release for the source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="translation-$GITHUB_SHA"
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --repo "$repo" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft)" = false ]; then
              gh release view "$tag" --repo "$repo" --json assets \
                --jq '[.assets[].name] | (index("rh-translation.pdf") != null and index("rh-translation.tex") != null)' | grep -qx true
              exit 0
            fi
          else
            gh release create "$tag" --repo "$repo" --target "$GITHUB_SHA" --draft --latest=false \
              --title "RH manuscript at ${GITHUB_SHA:0:12}" \
              --notes "PDF and single-file LaTeX from source commit $GITHUB_SHA."
          fi
          gh release upload "$tag" paper/rh-translation.pdf paper/rh-translation.tex --repo "$repo" --clobber
          gh release edit "$tag" --repo "$repo" --draft=false --latest=false
          echo "Published https://github.com/$repo/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
