name: Map the frozen source's geometric producers
on:
  push:
    paths:
      - '.github/workflows/rh-source-map.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read the frozen public source
        run: |
          mkdir -p formal-source
          curl --fail --location --retry 2 'https://github.com/ChristianKudeba/alpoge-rh-verification/archive/refs/tags/alpoge-source-7cbf7a0c.tar.gz' --output /tmp/rh-frozen-source.tar.gz
          sha256sum /tmp/rh-frozen-source.tar.gz
          tar -xzf /tmp/rh-frozen-source.tar.gz --strip-components=1 -C formal-source
      - name: Locate the exact saturation and slope producers
        run: |
          rg -n --glob '*.lean' 'FlatSat|height_comparison_global_model|SlopeBoundSt' formal-source/src | tee source-map.txt
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("formal-source/src").rglob("*.lean"):
              body=path.read_text(encoding="utf-8")
              if "FlatSat" in body and not path.name == "FlatSat.lean":
                  print("\nSOURCE FILE:",path)
                  print(body)
          PY
      - name: Preserve the source map
        uses: actions/upload-artifact@v4
        with:
          name: frozen-geometric-source-map
          path: source-map.txt
